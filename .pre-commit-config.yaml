repos:
  - repo: local
    hooks:
      - id: cicd-secret-scan
        name: CI/CD Secret Scanner
        entry: cicd-scanner scan
        language: python
        types: [yaml]
        files: '(\.gitlab-ci\.yml|\.github/workflows/.*\.yml|Jenkinsfile)$'
        args: ['--format', 'text', '--fail-on', 'critical']
        require_serial: true
        pass_filenames: true