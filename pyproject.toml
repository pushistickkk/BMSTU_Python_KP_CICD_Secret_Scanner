[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cicd-secret-scanner"
version = "0.1.0"
description = "Context-aware secret scanner for CI/CD configurations"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Zhukova Mariya"}
]

keywords = ["security", "ci-cd", "secrets", "scanner", "gitlab"]

dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "pydantic>=2.0",
    "pytest",
    "rich>=13.0",
]

[project.scripts]
cicd-scanner = "scanner.main:cli" # name for using from cli

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true